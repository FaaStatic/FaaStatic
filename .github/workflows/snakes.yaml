name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FaaStatic
          outputs: |
            profile/snake-dark.svg?palette=github-dark
            profile/snake-light.svg?palette=github-light

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/snake-dark.svg profile/snake-light.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update contribution snake [skip ci]"
            git push
          fi
