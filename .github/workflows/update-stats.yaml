name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # setiap hari jam 3 pagi UTC
  workflow_dispatch:       # bisa trigger manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # --- GitHub Stats Card ---
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >
            username=FaaStatic
            &show_icons=true
            &title_color=00E5FF
            &icon_color=6B3AFF
            &text_color=e6edf3
            &bg_color=0D1117
            &hide_border=true
            &rank_icon=github
            &include_all_commits=true
            &count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Top Languages Card ---
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >
            username=FaaStatic
            &layout=compact
            &title_color=00E5FF
            &text_color=e6edf3
            &bg_color=0D1117
            &hide_border=true
            &langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Commit & Push SVGs ---
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "chore: update stats cards [skip ci]" || echo "Nothing to commit"
          git push