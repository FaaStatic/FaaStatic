
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create profile folder if not exists
        run: mkdir -p profile

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >
            username=FaaStatic
            &show_icons=true
            &title_color=00F5FF
            &icon_color=FF4ECD
            &text_color=F8F8F2
            &bg_color=0D1117
            &hide_border=true
            &rank_icon=github
            &include_all_commits=true
            &count_private=true
            &ring_color=00F5FF
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >
            username=FaaStatic
            &layout=compact
            &title_color=00F5FF
            &text_color=F8F8F2
            &bg_color=0D1117
            &hide_border=true
            &langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git commit -m "chore: update stats cards [skip ci]" || echo "Nothing to commit"

          git push
