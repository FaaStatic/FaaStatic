<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Suhaili Faruq, mobile full-stack engineer">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FCEE0A" opacity=".05"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:Orbitron,Rajdhani,'Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:900}
    .m{font-family:'Share Tech Mono',Menlo,Consolas,'Courier New',monospace}
    .gr{animation:gr 6s steps(1) infinite}
    .gc{animation:gc 6s steps(1) infinite}
    @keyframes gr{0%,90%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(-5px,2px);opacity:.8}95%{transform:translate(3px,-1px);opacity:.6}}
    @keyframes gc{0%,90%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(4px,-2px);opacity:.8}95%{transform:translate(-2px,1px);opacity:.6}}
    @media (prefers-reduced-motion:reduce){.gr,.gc{animation:none}}
  </style>

  <rect width="1200" height="340" fill="#07040B"/>
  <rect width="1200" height="340" fill="url(#scan)"/>

  <path d="M24 24 H1140 L1176 60 V316 H60 L24 280 Z" fill="none" stroke="#FCEE0A" stroke-width="2"/>
  <polygon points="24,24 340,24 318,58 24,58" fill="#FCEE0A"/>
  <text x="42" y="47" class="m" font-size="18" fill="#000">ENGINEER PROFILE</text>
  <text x="1120" y="47" class="m" font-size="16" fill="#00F0FF" text-anchor="end">github.com/FaaStatic</text>

  <rect x="60" y="88" width="48" height="5" fill="#FF003C"/>
  <text x="120" y="95" class="m" font-size="15" fill="#8A8399">4+ YEARS OF PRODUCTION MOBILE DEVELOPMENT</text>

  <g class="t" font-size="84" letter-spacing="3">
    <text x="60" y="180" fill="#FF003C" class="gr" opacity="0" textLength="760" lengthAdjust="spacingAndGlyphs">SUHAILI FARUQ</text>
    <text x="60" y="180" fill="#00F0FF" class="gc" opacity="0" textLength="760" lengthAdjust="spacingAndGlyphs">SUHAILI FARUQ</text>
    <text x="60" y="180" fill="#FCEE0A" textLength="760" lengthAdjust="spacingAndGlyphs">SUHAILI FARUQ</text>
  </g>
  <text x="62" y="222" class="t" font-size="26" font-weight="700" letter-spacing="6" fill="#00F0FF">MOBILE FULL-STACK ENGINEER</text>
  <text x="62" y="254" class="m" font-size="18" fill="#C9C2D6">FLUTTER  ·  KOTLIN  ·  REACT NATIVE  ·  GO</text>

  <rect x="880" y="84" width="264" height="126" fill="#0E0716" stroke="#FCEE0A" stroke-opacity=".45"/>
  <text x="896" y="108" class="m" font-size="14" fill="#FCEE0A">OVERVIEW</text>
  <line x1="896" y1="118" x2="1128" y2="118" stroke="#FCEE0A" stroke-opacity=".3"/>
  <g class="m" font-size="16">
    <text x="896" y="144" fill="#8A8399">LOCATION</text>
    <text x="1128" y="144" fill="#FCEE0A" text-anchor="end">JAKARTA, ID</text>
    <text x="896" y="170" fill="#8A8399">PUBLISHED</text>
    <text x="1128" y="170" fill="#FCEE0A" text-anchor="end">7 APPS</text>
    <text x="896" y="196" fill="#8A8399">FOCUS</text>
    <text x="1128" y="196" fill="#FCEE0A" text-anchor="end">OFFLINE-FIRST</text>
  </g>

  <line x1="60" y1="282" x2="1140" y2="282" stroke="#FCEE0A" stroke-opacity=".25"/>
  <text x="60" y="302" class="m" font-size="14" fill="#8A8399">MOBILE  ·  BACKEND  ·  AI-ASSISTED DEVELOPMENT</text>
  <text x="1140" y="302" class="m" font-size="14" fill="#FCEE0A" text-anchor="end">portfolioweb-55f91.web.app</text>
</svg>
